<text x="80" y="100" class="sans" font-weight="600" font-size="22" fill="#E8604C" letter-spacing="0.18em">THE COHOUSING AFFORDABILITY GAP</text>
<text x="80" y="180" class="display" font-size="56" fill="#FFFFFF" letter-spacing="-0.02em">The math the cohousing</text>
