<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
<defs>
<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
@import url('https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&amp;display=swap');
.display { font-family: 'Clash Display', Inter, 'Helvetica Neue', 'Arial Black', Arial, sans-serif; font-weight: 700; }
.sans { font-family: 'DM Sans', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
</style>
</defs>
<rect width="1080" height="1350" fill="#1A1A2E"/>
<text x="1050" y="1576.8" text-anchor="end" class="display" font-size="1512" fill="#FFFFFF" opacity="0.045" letter-spacing="-0.04em">re</text>

<text x="80" y="220" class="sans" font-weight="600" font-size="30" fill="#E8604C" letter-spacing="0.18em">THE SHIFT</text>
<text x="80" y="420" class="display" font-size="86" fill="#FFFFFF" letter-spacing="-0.02em">There is a structure</text>
<text x="80" y="510" class="display" font-size="86" fill="#FFFFFF" letter-spacing="-0.02em">that fixes</text>
<text x="80" y="600" class="display" font-size="86" fill="#E8604C" letter-spacing="-0.02em">the math.</text>
<line x1="80" y1="660" x2="260" y2="660" stroke="#E8604C" stroke-width="4"/>
<text x="80" y="760" class="sans" font-weight="500" font-size="36" fill="#FFFFFF" opacity="0.88">Same private suite.</text>
<text x="80" y="810" class="sans" font-weight="500" font-size="36" fill="#FFFFFF" opacity="0.88">Same shared kitchen.</text>
<text x="80" y="860" class="sans" font-weight="500" font-size="36" fill="#FFFFFF" opacity="0.88">Same community.</text>
<text x="80" y="970" class="sans" font-weight="700" font-size="34" fill="#FFFFFF">Plus a membership interest in</text>
<text x="80" y="1015" class="sans" font-weight="700" font-size="34" fill="#FFFFFF">the LLC that owns the property.</text>
<text x="80" y="1095" class="sans" font-weight="700" font-size="34" fill="#E8604C">Wealth that stays with you.</text>

</svg>