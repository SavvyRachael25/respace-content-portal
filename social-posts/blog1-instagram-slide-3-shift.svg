<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
<defs>
<style type="text/css">
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700;800;900&amp;display=swap');
@import url('https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&amp;display=swap');
.display { font-family: 'Clash Display', Inter, 'Helvetica Neue', 'Arial Black', Arial, sans-serif; font-weight: 700; }
.sans { font-family: 'DM Sans', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
</style>
</defs>
<rect width="1080" height="1350" fill="#1A1A2E"/>
<text x="1050" y="1576.8" text-anchor="end" class="display" font-size="1512" fill="#FFFFFF" opacity="0.045" letter-spacing="-0.04em">re</text>

<text x="80" y="220" class="sans" font-weight="600" font-size="30" fill="#E8604C" letter-spacing="0.18em">THE SHIFT</text>
<text x="80" y="430" class="display" font-size="96" fill="#FFFFFF" letter-spacing="-0.02em">Realtor.com</text>
<text x="80" y="540" class="display" font-size="96" fill="#FFFFFF" letter-spacing="-0.02em">noticed why</text>
<text x="80" y="650" class="display" font-size="96" fill="#E8604C" letter-spacing="-0.02em">it changed.</text>
<line x1="80" y1="730" x2="260" y2="730" stroke="#E8604C" stroke-width="4"/>
<text x="80" y="830" class="sans" font-weight="500" font-size="36" fill="#FFFFFF" opacity="0.88">They featured a Seattle startup</text>
<text x="80" y="885" class="sans" font-weight="500" font-size="36" fill="#FFFFFF" opacity="0.88">using co-homeownership to combat</text>
<text x="80" y="940" class="sans" font-weight="500" font-size="36" fill="#FFFFFF" opacity="0.88">the affordability crisis.</text>
<text x="80" y="1050" class="sans" font-weight="700" font-size="36" fill="#FFFFFF">One existing home. Multiple owners.</text>
<text x="80" y="1105" class="sans" font-weight="700" font-size="36" fill="#FFFFFF">A new category of ownership.</text>

</svg>